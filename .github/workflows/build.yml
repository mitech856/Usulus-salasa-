name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Create buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Usulus Salasa
        package.name = usulussalasa
        package.domain = com.mitech85
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,mp3
        version = 1.0.0
        requirements = python3,kivy==2.3.0,kivymd==1.2.0,pyjnius
        icon.filename = %(source.dir)s/icône.png
        orientation = portrait
        fullscreen = 0
        android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET
        android.api = 33
        android.minapi = 21
        android.accept_sdk_licenses = True

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk
        pip install buildozer cython

    - name: Build APK
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UsulusSalasa-APK
        path: bin/*.apk
        
